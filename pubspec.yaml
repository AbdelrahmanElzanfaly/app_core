version: 0.4.2
publish_to: none

environment:
  sdk: ">=3.7.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  app_network:
    git:
      url: https://github.com/AbdelrahmanElzanfaly/app_network.git
      ref: v0.2.2

  bloc: ^9.2.1
  connectivity_plus: ^7.3.2
  dio: ^5.11.1
  equatable: ">=2.0.7 <4.0.0"
  flutter_bloc: ^9.1.1
  flutter_secure_storage: ^11.2.0
  get_it: ^9.3.0
  injectable: ^3.0.0
  material_ui: ^1.11.0
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  bloc_concurrency: ^0.3.0
  fake_async: ^1.3.3
