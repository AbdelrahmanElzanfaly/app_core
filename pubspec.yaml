dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  app_network:
    git:
      url: https://github.com/AbdelrahmanElzanfaly/app_network.git
      ref: v0.2.0

  bloc: ^9.1.0
